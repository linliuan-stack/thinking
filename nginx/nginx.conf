worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # ── Gzip ─────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # ── Upstream: Python Auth + Experiment Service ──
    upstream python_service {
        least_conn;
        server auth-python:8001;
        server auth-python-backup:8001 backup;
    }

    # ── Upstream: Java Module Service ───────────────
    upstream java_service {
        least_conn;
        server module-java:8002;
        server module-java-backup:8002 backup;
    }

    # ── Upstream: Frontend (dev mode only) ─────────
    upstream frontend_dev {
        server frontend:80;
    }

    server {
        listen 80;
        server_name localhost;

        # ── API: Auth (Python) ──────────────────────
        location /api/auth {
            proxy_pass http://python_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_next_upstream error timeout http_502 http_503;
        }

        # ── API: Experiment (Python) ────────────────
        location /api/experiment {
            proxy_pass http://python_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_next_upstream error timeout http_502 http_503;
        }

        # ── API: Modules (Java) ────────────────────
        location /api/modules {
            proxy_pass http://java_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_next_upstream error timeout http_502 http_503;
        }

        # ── Frontend (static files from frontend container) ──
        location / {
            proxy_pass http://frontend_dev;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
